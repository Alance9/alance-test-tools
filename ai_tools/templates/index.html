<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>测试智能体</title>
    <style>
        /* ===== 全局：全屏布局（顶部工具条 + 智能体 iframe） ===== */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; }
        body {
            font-family: 'Segoe UI', 'Microsoft YaHei', Arial, sans-serif;
            background: #fff;
            color: #222;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* ===== 顶部工具条 ===== */
        .bar {
            flex-shrink: 0;
            height: 52px;
            display: flex;
            align-items: center;
            padding: 0 18px;
            background: #fafafa;
            border-bottom: 2px solid #e0e0e0;
            gap: 12px;
        }
        .bar .title {
            font-size: 1rem;
            font-weight: 600;
            color: #333;
            white-space: nowrap;
        }
        .bar .actions { margin-left: auto; display: flex; gap: 8px; flex-shrink: 0; }
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border: 1px solid #999;
            background: #fff;
            color: #333;
            border-radius: 4px;
            padding: 7px 16px;
            font-size: 0.8125rem;
            cursor: pointer;
            white-space: nowrap;
            font-family: inherit;
            text-decoration: none;
            line-height: 1.2;
        }
        .btn:hover { border-color: #444; }
        .btn.primary { background: #444; border-color: #444; color: #fff; }
        .btn.primary:hover { background: #333; }

        /* ===== 智能体内嵌区：直接内嵌 Coze URL，不加任何遮挡层 ===== */
        .frame-wrap { flex: 1; min-height: 0; }
        .frame-wrap iframe { width: 100%; height: 100%; border: none; display: block; }

        /* ===== 轻量提示：仅新开窗口被浏览器拦截时出现，5 秒后自动消失 ===== */
        .toast {
            display: none;
            position: fixed;
            top: 64px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 99;
            background: rgba(51,51,51,0.92);
            color: #fff;
            font-size: 0.8125rem;
            padding: 10px 20px;
            border-radius: 6px;
            white-space: nowrap;
            pointer-events: none;
        }
        .toast.show { display: block; }

        /* ===== 小屏：按钮紧凑 ===== */
        @media (max-width: 768px) {
            .bar { padding: 0 10px; height: 48px; gap: 8px; }
            .btn { padding: 6px 12px; }
            .toast { font-size: 0.75rem; padding: 8px 14px; max-width: 90vw; white-space: normal; text-align: center; }
        }
    </style>
</head>
<body>
    <!-- 顶部工具条 -->
    <div class="bar">
        <span class="title">测试智能体</span>
        <div class="actions">
            <!-- 原生 target=_blank 链接：用户手势内导航，任何嵌套层级都不会被弹窗拦截 -->
            <a class="btn primary"
               href="https://www.coze.cn/store/agent/7682838870320431113?bot_id=true"
               target="_blank" rel="noopener noreferrer">新标签页访问</a>
            <button class="btn" type="button" onclick="reloadFrame()">刷新</button>
        </div>
    </div>

    <!-- 智能体内嵌区：直接访问 Coze URL，无遮挡，页面可正常交互 -->
    <div class="frame-wrap">
        <!--
            sandbox 作用（实测有效，不改变访问 URL 与页面交互）：
            - allow-popups / allow-popups-to-escape-sandbox：Coze 的登录弹窗可正常弹出；
            - 火山 SSO 在 sandboxed frame 中可正常渲染登录页，不再出现
              "signin.volcengine.com 拒绝了我们的连接请求"；
            - 不给 allow-top-navigation：禁止内嵌页劫持外层平台窗口。
        -->
        <iframe id="agentFrame"
                src="https://www.coze.cn/store/agent/7682838870320431113?bot_id=true"
                sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-popups-to-escape-sandbox allow-downloads allow-modals"
                referrerpolicy="no-referrer-when-downgrade"
                title="测试智能体"></iframe>
    </div>

    <!-- 新开窗口被拦截时的轻量提示（自动消失） -->
    <div class="toast" id="toast"></div>

    <script>
        /** 智能体页面地址（Coze 商店 bot 页） */
        const AGENT_URL = 'https://www.coze.cn/store/agent/7682838870320431113?bot_id=true';

        const frame = document.getElementById('agentFrame');
        const toast = document.getElementById('toast');
        let toastTimer = null;
        /** 整页加载计数：第 1 次为 Coze 本体；其站内操作是 SPA 不触发整页 load */
        let loadCount = 0;
        /** 第 1 次整页加载的时间戳，用于排除页面初始阶段的重定向 */
        let firstLoadAt = 0;
        /** 一次异常只处理一轮，防止多次 load 重复开窗/刷新 */
        let handling = false;

        /** 显示 5 秒后自动消失的轻量提示 */
        function showToast(text) {
            toast.textContent = text;
            toast.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => toast.classList.remove('show'), 5000);
        }

        /**
         * 重新加载内嵌页到固定 URL：先置空再赋回，强制刷新，
         * 并重置检测状态。about:blank 的 load 事件不计入。
         */
        function reloadFrame() {
            handling = false;
            loadCount = 0;
            firstLoadAt = 0;
            frame.src = 'about:blank';
            setTimeout(() => { frame.src = AGENT_URL; }, 60);
        }

        /**
         * 登录异常自动处理：
         * Coze 正常使用是 SPA，站内点击不产生整页加载；点"开始使用"后若
         * 内嵌整页跳转到 signin.volcengine.com（弹窗被拦后的回退跳转，
         * 未加 sandbox 时会显示"拒绝连接"），必然产生第 2 次整页 load。
         * 此时：① 尝试新开窗口打开智能体（距用户点击很近，多数浏览器放行；
         * 被拦则 toast 引导用右上角按钮）；② 立即把内嵌页刷新回智能体 URL。
         * 首屏 2 秒内的多次 load 视为初始重定向，不处理。
         */
        frame.addEventListener('load', () => {
            if (frame.src === 'about:blank') return;
            loadCount++;
            if (loadCount === 1) {
                firstLoadAt = Date.now();
                return;
            }
            if (handling) return;
            if (firstLoadAt && Date.now() - firstLoadAt < 2000) return;
            handling = true;

            const win = window.open(AGENT_URL, '_blank', 'noopener');
            if (!win) {
                showToast('新窗口被浏览器拦截，请点击右上角【新标签页访问】登录');
            }
            reloadFrame();
        });
    </script>
</body>
</html>
