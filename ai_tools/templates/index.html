<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>测试智能体</title>
    <style>
        /* ===== 全局：全屏布局（顶部工具条 + 智能体 iframe） ===== */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; }
        body {
            font-family: 'Segoe UI', 'Microsoft YaHei', Arial, sans-serif;
            background: #fff;
            color: #222;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* ===== 顶部工具条 ===== */
        .bar {
            flex-shrink: 0;
            height: 52px;
            display: flex;
            align-items: center;
            padding: 0 18px;
            background: #fafafa;
            border-bottom: 2px solid #e0e0e0;
            gap: 12px;
        }
        .bar .title {
            font-size: 1rem;
            font-weight: 600;
            color: #333;
            white-space: nowrap;
        }
        .bar .tip {
            font-size: 0.75rem;
            color: #999;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .bar .actions { margin-left: auto; display: flex; gap: 8px; flex-shrink: 0; }
        .btn {
            border: 1px solid #999;
            background: #fff;
            color: #333;
            border-radius: 4px;
            padding: 7px 16px;
            font-size: 0.8125rem;
            cursor: pointer;
            white-space: nowrap;
            font-family: inherit;
        }
        .btn:hover { border-color: #444; }
        .btn.primary { background: #444; border-color: #444; color: #fff; }
        .btn.primary:hover { background: #333; }

        /* ===== 智能体内嵌区 ===== */
        .frame-wrap { flex: 1; min-height: 0; }
        .frame-wrap iframe { width: 100%; height: 100%; border: none; display: block; }

        /* ===== 轻量提示：仅弹窗被浏览器拦截时出现，数秒后自动消失 ===== */
        .toast {
            display: none;
            position: fixed;
            top: 64px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 99;
            background: rgba(51,51,51,0.92);
            color: #fff;
            font-size: 0.8125rem;
            padding: 10px 20px;
            border-radius: 6px;
            white-space: nowrap;
            pointer-events: none;
        }
        .toast.show { display: block; }

        /* ===== 小屏：按钮紧凑 ===== */
        @media (max-width: 768px) {
            .bar { padding: 0 10px; height: 48px; gap: 8px; }
            .btn { padding: 6px 12px; }
        }
    </style>
</head>
<body>
    <!-- 顶部工具条 -->
    <div class="bar">
        <span class="title">测试智能体</span>
        <div class="actions">
            <button class="btn primary" onclick="openInNewTab()">新标签页访问</button>
            <button class="btn" onclick="reloadFrame()">刷新</button>
        </div>
    </div>

    <!-- 智能体内嵌区 -->
    <div class="frame-wrap">
        <!-- 直接内嵌 Coze 商店 bot 页，页面内可正常交互 -->
        <iframe id="agentFrame"
                src="https://www.coze.cn/store/agent/7682838870320431113?bot_id=true"
                referrerpolicy="no-referrer-when-downgrade"
                title="测试智能体"></iframe>
    </div>

    <!-- 弹窗被拦截时的轻量提示（自动消失，不阻断操作） -->
    <div class="toast" id="toast"></div>

    <script>
        /** 智能体页面地址（Coze 商店 bot 页）：iframe 常驻展示、新窗口打开均用此地址 */
        const AGENT_URL = 'https://www.coze.cn/store/agent/7682838870320431113?bot_id=true';

        const frame = document.getElementById('agentFrame');
        const toast = document.getElementById('toast');
        let toastTimer = null;
        /** iframe 整页加载计数：第 1 次为 Coze 本体；其站内操作是 SPA，不触发整页 load */
        let loadCount = 0;
        /** 一次登录异常只处理一轮，防止多次 load 重复弹窗 */
        let handling = false;
        /** 用户是否在内嵌页上点击过（跨域下父文档仍能收到 iframe 元素的 pointerdown），
         *  仅在交互后武装检测，避免页面初始重定向造成误判 */
        let interacted = false;

        /** 显示数秒后自动消失的轻量提示 */
        function showToast(text) {
            toast.textContent = text;
            toast.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => toast.classList.remove('show'), 5000);
        }

        /**
         * 顶层新窗口打开智能体固定地址。
         * @returns {Window|null} 新窗口引用；为 null 表示被浏览器拦截
         */
        function openInNewTab() {
            const win = window.open(AGENT_URL, '_blank', 'noopener');
            if (!win) {
                showToast('登录窗口被浏览器拦截，请点击右上角【新标签页访问】');
            }
            return win;
        }

        /**
         * 重新加载内嵌页到固定 URL：先置空再赋回，强制刷新。
         * 同时重置加载计数与处理标记，恢复检测能力。
         */
        function reloadFrame() {
            handling = false;
            loadCount = 0;
            interacted = false;
            frame.src = 'about:blank';
            setTimeout(() => { frame.src = AGENT_URL; }, 60);
        }

        /* 记录用户在内嵌区域的点击（点"开始使用"等），用于武装异常检测 */
        frame.addEventListener('pointerdown', () => { interacted = true; });

        /**
         * 检测内嵌登录异常并自动处理：
         * - 第 1 次整页 load：Coze 页面本体正常加载
         * - 用户交互后出现第 2 次整页 load：Coze 正常使用是 SPA 不会整页跳转，
         *   只可能是点"开始使用"后内嵌跳转到了 signin.volcengine.com，
         *   被其 CSP frame-ancestors 拦截（页面显示"拒绝了我们的连接请求"）。
         *   此时自动：① 新开窗口打开 URL（距用户点击通常仍在浏览器瞬态激活
         *   窗口内，弹窗可放行；顶层导航不受 frame-ancestors 限制）；
         *   ② 重新刷新内嵌页回到智能体。若弹窗被拦截，toast 提示用右上角按钮。
         */
        frame.addEventListener('load', () => {
            if (frame.src === 'about:blank') return;
            loadCount++;
            if (loadCount < 2 || handling || !interacted) return;
            handling = true;
            openInNewTab();
            reloadFrame();
        });
    </script>
</body>
</html>
