<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数据格式转换工具</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', 'Microsoft YaHei', Arial, sans-serif; background: #fff; min-height: 100vh; padding: 30px 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        .header { text-align: center; color: #222; margin-bottom: 40px; }
        .header h1 { font-size: 2.625rem; margin-bottom: 12px; font-weight: 600; letter-spacing: 1px; }
        .header p { font-size: 1.125rem; color: #666; }
        .card { background: #fff; border-radius: 6px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); overflow: hidden; border: 1px solid #ddd; margin-bottom: 30px; }
        .tabs { display: flex; background: #fff; border-bottom: 1px solid #e0e0e0; flex-wrap: wrap; padding-left: 30px; }
        .tab { padding: 14px 22px; cursor: pointer; font-weight: 500; color: #444; border-bottom: 2px solid transparent; transition: all 0.2s; font-size: 1rem; }
        .tab:hover { background: #f8fcff; color: #222; }
        .tab.active { color: #333; border-bottom-color: #666; background: #fff; }
        .tab-content { padding: 30px; display: none; }
        .tab-content.active { display: block; }
        .card-title { font-size: 1.375rem; font-weight: 600; margin-bottom: 22px; color: #333; padding-bottom: 10px; border-bottom: 2px solid #ccc; }
        .form-group { margin-bottom: 18px; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: 500; color: #444; font-size: 1rem; }
        .form-group textarea, .form-group input, .form-group select { width: 100%; padding: 12px 14px; border: 2px solid #ccc; border-radius: 4px; font-size: 16px; transition: all 0.2s; background: #fff; color: #222; font-family: 'Segoe UI', 'Microsoft YaHei', Arial, sans-serif; }
        .form-group textarea { min-height: 150px; resize: vertical; }
        .form-group textarea:focus, .form-group input:focus { outline: none; border-color: #666; box-shadow: 0 0 0 2px rgba(102,102,102,0.1); }
        .btn { background: #444; color: #fff; border: none; padding: 12px 28px; border-radius: 4px; cursor: pointer; font-weight: 500; letter-spacing: 0.5px; transition: all 0.2s; font-size: 1rem; }
        .btn:hover { background: #333; box-shadow: 0 2px 8px rgba(0,0,0,0.2); }
        .btn-secondary { background: #f5f5f5; color: #555; border: 1px solid #ddd; }
        .btn-secondary:hover { background: #eee; color: #333; box-shadow: none; }
        .btn:disabled { background: #aaa; cursor: not-allowed; }
        .btn-group { display: flex; gap: 10px; flex-wrap: wrap; }
        .output-box { border: 2px solid #ccc; border-radius: 4px; padding: 16px; background: #fff; margin-top: 12px; font-family: 'Segoe UI', 'Microsoft YaHei', Arial, sans-serif; font-size: 15px; color: #222; white-space: pre-wrap; word-break: break-all; max-height: 500px; overflow-y: auto; }
        .qr-result { text-align: center; margin-top: 16px; }
        .qr-result img { max-width: 400px; border: 1px solid #ddd; border-radius: 4px; }
        .toast { position: fixed; top: 20px; right: 20px; background: #444; color: white; padding: 12px 24px; border-radius: 4px; font-size: 14px; z-index: 9999; opacity: 0; transition: opacity 0.3s; box-shadow: 0 2px 8px rgba(0,0,0,0.2); }
        .result-success { color: #2e7d32; }
        .result-error { color: #c62828; }
        .radio-group { display: flex; gap: 20px; margin-bottom: 18px; }
        .radio-group label { display: flex; align-items: center; gap: 6px; cursor: pointer; font-weight: 500; color: #444; font-size: 1rem; margin-bottom: 0; }
        .radio-group input[type="radio"] { width: auto; cursor: pointer; }

        /* 文件上传区 */
        .upload-area { border: 2px dashed #ccc; border-radius: 6px; padding: 40px; text-align: center; cursor: pointer; transition: all 0.2s; background: #fafafa; margin-bottom: 18px; }
        .upload-area:hover { border-color: #666; background: #f0f0f0; }
        .upload-area.has-file { border-style: solid; border-color: #666; background: #fff; }
        .upload-area input[type="file"] { display: none; }
        .upload-icon { font-size: 2.5rem; color: #999; margin-bottom: 10px; }
        .upload-text { color: #666; font-size: 0.9375rem; }
        .upload-filename { color: #2e7d32; font-weight: 500; font-size: 1rem; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>数据格式转换工具</h1>
            <!-- <p>时间戳、二维码/条形码、文件格式转换</p> -->
        </div>
        <div class="card">
            <div class="tabs">
                <div class="tab active" onclick="switchTab('timestamp')">时间戳转换</div>
                <div class="tab" onclick="switchTab('qr')">二维码/条形码</div>
                <div class="tab" onclick="switchTab('jsonConvert')">JSON转换</div>
            </div>

            <!-- 时间戳转换 -->
            <div id="timestamp" class="tab-content active">
                <div class="card-title">时间戳转换</div>
                <div class="radio-group">
                    <label><input type="radio" name="tsType" value="to_date" checked onchange="tsTypeChanged()"> 时间戳 → 日期</label>
                    <label><input type="radio" name="tsType" value="to_timestamp" onchange="tsTypeChanged()"> 日期 → 时间戳</label>
                </div>
                <div class="form-group">
                    <label id="tsInputLabel">时间戳（秒或毫秒）</label>
                    <input type="text" id="tsValue" placeholder="输入时间戳，如 1704067200 或 1704067200000">
                </div>
                <div class="btn-group">
                    <button class="btn" onclick="doTimestampConvert()">转换</button>
                    <button class="btn btn-secondary" onclick="getCurrentTimestamp()">获取当前时间戳</button>
                    <button class="btn btn-secondary" onclick="copyTimestampResult()">复制结果</button>
                </div>
                <div id="tsResult" class="output-box" style="display:none;"></div>
            </div>

            <!-- 二维码/条形码 -->
            <div id="qr" class="tab-content">
                <div class="card-title">二维码/条形码</div>
                <div class="radio-group">
                    <label><input type="radio" name="qrType" value="qrcode" checked> 二维码</label>
                    <label><input type="radio" name="qrType" value="barcode"> 条形码</label>
                </div>
                <div class="form-group">
                    <label>输入内容</label>
                    <textarea id="qrData" placeholder="二维码支持任意文本；条形码支持字母和数字（最多40字符）"></textarea>
                </div>
                <button class="btn" onclick="generateCode()">生成</button>
                <div id="qrResult" class="qr-result"></div>
            </div>

            <!-- JSON转换（文件上传） -->
            <div id="jsonConvert" class="tab-content">
                <div class="card-title">JSON转换</div>
                <div class="radio-group">
                    <label><input type="radio" name="convertType" value="json_to_csv" checked> JSON → CSV</label>
                    <label><input type="radio" name="convertType" value="json_to_excel"> JSON → Excel</label>
                    <label><input type="radio" name="convertType" value="json_to_xml"> JSON → XML</label>
                    <label><input type="radio" name="convertType" value="csv_to_json"> CSV → JSON</label>
                </div>
                <div id="uploadArea" class="upload-area" onclick="document.getElementById('fileInput').click()">
                    <div class="upload-icon">📁</div>
                    <div id="uploadPrompt" class="upload-text">点击选择文件，或将文件拖放到此处</div>
                    <div id="uploadFilename" class="upload-filename" style="display:none;"></div>
                    <input type="file" id="fileInput" onchange="handleFileSelect(event)">
                </div>
                <div class="btn-group">
                    <button class="btn" id="convertBtn" onclick="doConvert()" disabled>转换并下载</button>
                </div>
                <div id="convertResult" class="output-box" style="display:none;"></div>
            </div>
        </div>
    </div>

    <script>
        let selectedFile = null;

        /**
         * 切换 Tab
         */
        function switchTab(name) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            document.querySelector(`.tab[onclick="switchTab('${name}')"]`).classList.add('active');
            document.getElementById(name).classList.add('active');
        }

        /**
         * 时间戳类型切换时更新 placeholder
         */
        function tsTypeChanged() {
            const type = document.querySelector('input[name="tsType"]:checked').value;
            const input = document.getElementById('tsValue');
            const label = document.getElementById('tsInputLabel');
            if (type === 'to_date') {
                label.textContent = '时间戳（秒或毫秒）';
                input.placeholder = '输入时间戳，如 1704067200 或 1704067200000';
            } else {
                label.textContent = '日期时间';
                input.placeholder = '2025-01-01 12:00:00';
            }
        }

        /**
         * 获取当前时间戳并自动填入
         */
        function getCurrentTimestamp() {
            const now = new Date();
            const input = document.getElementById('tsValue');
            const type = document.querySelector('input[name="tsType"]:checked').value;
            if (type === 'to_date') {
                input.value = Math.floor(now.getTime() / 1000);
            } else {
                const pad = (n) => String(n).padStart(2, '0');
                input.value = `${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())} ${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
            }
            doTimestampConvert();
        }

        /**
         * 复制时间戳转换结果
         */
        function copyTimestampResult() {
            const box = document.getElementById('tsResult');
            if (box.style.display !== 'none' && box.textContent) {
                copyText(box.textContent);
            } else {
                showToast('无结果可复制');
            }
        }

        /**
         * 复制文本通用函数
         */
        function copyText(text) {
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text).then(() => showToast('已复制'));
            } else {
                const ta = document.createElement('textarea');
                ta.value = text;
                ta.style.position = 'fixed';
                ta.style.opacity = '0';
                document.body.appendChild(ta);
                ta.select();
                try { document.execCommand('copy'); showToast('已复制'); } catch(e) { showToast('复制失败'); }
                document.body.removeChild(ta);
            }
        }

        /**
         * 时间戳转换
         */
        async function doTimestampConvert() {
            const val = document.getElementById('tsValue').value.trim();
            const type = document.querySelector('input[name="tsType"]:checked').value;
            const box = document.getElementById('tsResult');
            try {
                const res = await fetch('api/timestamp/convert', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ value: val, type: type })
                });
                const r = await res.json();
                box.style.display = 'block';
                if (r.success) {
                    box.className = 'output-box result-success';
                    if (type === 'to_date') {
                        box.textContent = `日期时间：${r.result}\n秒时间戳：${r.s}\n毫秒时间戳：${r.ms}`;
                    } else {
                        box.textContent = `秒时间戳：${r.s}\n毫秒时间戳：${r.ms}`;
                    }
                } else {
                    box.className = 'output-box result-error';
                    box.textContent = r.error || '转换失败';
                }
            } catch (e) {
                box.style.display = 'block';
                box.className = 'output-box result-error';
                box.textContent = '转换失败，请检查网络';
            }
        }

        /**
         * 生成二维码或条形码
         */
        async function generateCode() {
            const val = document.getElementById('qrData').value;
            const type = document.querySelector('input[name="qrType"]:checked').value;
            const box = document.getElementById('qrResult');

            if (!val.trim()) {
                box.innerHTML = `<div class="output-box result-error">请输入内容</div>`;
                return;
            }

            try {
                const endpoint = type === 'qrcode' ? 'api/qrcode/generate' : 'api/barcode/generate';
                const res = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ data: val })
                });
                const r = await res.json();
                if (r.success) {
                    box.innerHTML = `
                        <img src="${r.image}" alt="${type}" style="cursor: zoom-in;" onclick="window.open(this.src)">
                        <div style="margin-top:12px;">
                            <button class="btn" onclick="downloadDataUrl('${r.image}', '${type === 'qrcode' ? 'qrcode.png' : 'barcode.png'}')">下载图片</button>
                        </div>
                    `;
                } else {
                    box.innerHTML = `<div class="output-box result-error">${r.error}</div>`;
                }
            } catch (e) {
                box.innerHTML = `<div class="output-box result-error">生成失败</div>`;
            }
        }

        /**
         * 下载 data URL 图片
         */
        function downloadDataUrl(dataUrl, filename) {
            const a = document.createElement('a');
            a.href = dataUrl;
            a.download = filename;
            a.click();
        }

        /**
         * 处理文件选择
         */
        function handleFileSelect(event) {
            const file = event.target.files[0];
            if (!file) return;

            const convertType = document.querySelector('input[name="convertType"]:checked').value;
            const ext = file.name.split('.').pop().toLowerCase();

            // 验证文件类型
            if ((convertType === 'csv_to_json' && ext !== 'csv') ||
                ((convertType.startsWith('json_to')) && ext !== 'json')) {
                showToast(`请上传 ${convertType === 'csv_to_json' ? 'CSV' : 'JSON'} 文件`);
                event.target.value = '';
                return;
            }

            selectedFile = file;
            const area = document.getElementById('uploadArea');
            const prompt = document.getElementById('uploadPrompt');
            const filenameEl = document.getElementById('uploadFilename');

            area.classList.add('has-file');
            prompt.style.display = 'none';
            filenameEl.style.display = 'block';
            filenameEl.textContent = `已选择：${file.name}`;
            document.getElementById('convertBtn').disabled = false;
        }

        /**
         * 转换并下载文件
         */
        async function doConvert() {
            if (!selectedFile) {
                showToast('请先选择文件');
                return;
            }

            const type = document.querySelector('input[name="convertType"]:checked').value;
            const formData = new FormData();
            formData.append('file', selectedFile);
            formData.append('type', type);

            try {
                document.getElementById('convertBtn').disabled = true;
                document.getElementById('convertBtn').textContent = '转换中...';

                const res = await fetch('api/convert/upload', {
                    method: 'POST',
                    body: formData
                });
                const r = await res.json();

                document.getElementById('convertBtn').disabled = false;
                document.getElementById('convertBtn').textContent = '转换并下载';

                if (r.success) {
                    if (r.file) {
                        // Excel - 直接下载
                        const a = document.createElement('a');
                        a.href = `data:application/vnd.openxmlformats-officedocument.spreadsheetml.sheet;base64,${r.file}`;
                        a.download = r.filename;
                        a.click();
                        showToast('转换成功，已下载');
                    } else {
                        // 文本结果 - 显示在输出框并提供下载
                        const box = document.getElementById('convertResult');
                        box.style.display = 'block';
                        box.className = 'output-box';
                        box.textContent = r.result;

                        // 自动下载
                        const mime = type === 'json_to_xml' ? 'application/xml' :
                                     type === 'json_to_csv' ? 'text/csv' : 'application/json';
                        const blob = new Blob([r.result], { type: mime + ';charset=utf-8' });
                        const a = document.createElement('a');
                        a.href = URL.createObjectURL(blob);
                        a.download = r.filename;
                        a.click();
                        showToast('转换成功，已下载');
                    }
                } else {
                    const box = document.getElementById('convertResult');
                    box.style.display = 'block';
                    box.className = 'output-box result-error';
                    box.textContent = r.error || '转换失败';
                }
            } catch (e) {
                document.getElementById('convertBtn').disabled = false;
                document.getElementById('convertBtn').textContent = '转换并下载';
                showToast('转换失败：' + e.message);
            }
        }

        /**
         * 显示 Toast 提示
         */
        function showToast(msg) {
            let t = document.getElementById('toast');
            if (!t) { t = document.createElement('div'); t.id = 'toast'; t.className = 'toast'; document.body.appendChild(t); }
            t.textContent = msg; t.style.opacity = '1';
            setTimeout(() => t.style.opacity = '0', 2000);
        }

        // 文件类型变化时重新验证已选文件
        document.querySelectorAll('input[name="convertType"]').forEach(radio => {
            radio.addEventListener('change', () => {
                if (selectedFile) {
                    handleFileSelect({ target: { files: [selectedFile], value: '' } });
                }
            });
        });
    </script>
</body>
</html>
