<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alance 测试工具平台</title>
    <style>
        /* ===== 全局 ===== */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; }
        body {
            font-family: 'Segoe UI', 'Microsoft YaHei', Arial, sans-serif;
            background: #f0f0f0;
            color: #222;
            display: flex;
            flex-direction: column;
        }

        /* ===== 顶部 header ===== */
        .header {
            height: 60px;
            flex-shrink: 0;
            background: #2b2b2b;
            color: #fff;
            display: flex;
            align-items: center;
            padding: 0 28px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.15);
            z-index: 10;
        }
        .header .logo {
            width: 30px;
            height: 30px;
            border: 2px solid #fff;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 15px;
            margin-right: 14px;
            letter-spacing: 0;
        }
        .header h1 {
            font-size: 1.25rem;
            font-weight: 600;
            letter-spacing: 1px;
        }
        .header .sub {
            margin-left: 16px;
            font-size: 0.8125rem;
            color: #aaa;
            font-weight: 400;
        }
        /* 侧栏头部（Tools List + 收缩按钮） */
        .side-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 14px 12px;
        }
        .side-head .group-title {
            font-size: 0.75rem;
            color: #999;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        /* 收缩/展开按钮（« 收起 / » 展开） */
        .side-toggle {
            width: 26px;
            height: 26px;
            flex-shrink: 0;
            background: #fff;
            border: 1px solid #ccc;
            border-radius: 4px;
            color: #444;
            font-size: 14px;
            line-height: 1;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .side-toggle:hover { background: #eee; border-color: #999; }
        .side-toggle .ico-expand { display: none; }

        /* 移动端抽屉菜单遮罩 */
        .mask {
            display: none;
            position: fixed;
            top: 60px;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.4);
            z-index: 40;
        }

        /* ===== 邀请码门禁 ===== */
        .gate {
            position: fixed;
            inset: 0;
            background: #f0f0f0;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }
        .gate.hidden { display: none; }
        .gate-card {
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 40px 44px;
            width: 360px;
            text-align: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }
        .gate-card .gate-logo {
            width: 52px;
            height: 52px;
            border: 2px solid #444;
            border-radius: 10px;
            margin: 0 auto 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: 700;
            color: #444;
        }
        .gate-card h2 {
            font-size: 1.125rem;
            color: #333;
            margin-bottom: 6px;
        }
        .gate-card p {
            font-size: 0.875rem;
            color: #999;
            margin-bottom: 22px;
        }
        .gate-card input {
            width: 100%;
            padding: 12px 14px;
            border: 2px solid #ccc;
            border-radius: 4px;
            font-size: 16px;
            text-align: center;
            letter-spacing: 2px;
            margin-bottom: 14px;
        }
        .gate-card input:focus {
            outline: none;
            border-color: #666;
        }
        .gate-card .btn {
            width: 100%;
            background: #444;
            color: #fff;
            border: none;
            padding: 12px 0;
            border-radius: 4px;
            font-size: 1rem;
            cursor: pointer;
            letter-spacing: 2px;
        }
        .gate-card .btn:hover { background: #333; }
        .gate-error {
            color: #c62828;
            font-size: 0.8125rem;
            min-height: 18px;
            margin-top: 10px;
        }

        /* ===== 主体：左菜单 + 右内容 ===== */
        .main {
            flex: 1;
            display: flex;
            min-height: 0;
        }

        /* ===== 左侧菜单 ===== */
        .sidebar {
            width: 230px;
            flex-shrink: 0;
            background: #fafafa;
            border-right: 1px solid #e0e0e0;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 14px 0;
            transition: width 0.2s ease;
        }
        .menu-item {
            display: flex;
            align-items: center;
            padding: 13px 24px;
            font-size: 0.9375rem;
            color: #444;
            cursor: pointer;
            border-left: 3px solid transparent;
            transition: background 0.15s, color 0.15s;
            user-select: none;
            white-space: nowrap;
        }
        .menu-item:hover {
            background: #efefef;
            color: #111;
        }
        .menu-item.active {
            background: #444;
            color: #fff;
            border-left-color: #999;
            font-weight: 500;
        }
        .menu-item .idx {
            width: 22px;
            color: #aaa;
            font-size: 0.8125rem;
            flex-shrink: 0;
        }
        .menu-item.active .idx { color: #ccc; }

        /* ===== 收缩态：极简窄条（按钮 + 01、02... 序号） ===== */
        body.side-collapsed .sidebar { width: 52px; padding: 10px 0; }
        body.side-collapsed .side-head { justify-content: center; padding: 2px 0 10px; }
        body.side-collapsed .group-title { display: none; }
        body.side-collapsed .menu-item {
            justify-content: center;
            padding: 13px 0;
            border-left: none;
        }
        body.side-collapsed .menu-item .menu-name { display: none; }
        body.side-collapsed .side-toggle .ico-collapse { display: none; }
        body.side-collapsed .side-toggle .ico-expand { display: inline; }

        /* ===== 右侧功能区 ===== */
        .content {
            flex: 1;
            min-width: 0;
            background: #fff;
        }
        .content iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        /* ===== 移动端适配 ===== */
        @media (max-width: 768px) {
            .header { padding: 0 14px; }
            .header h1 { font-size: 1rem; letter-spacing: 0; }
            .header .sub { display: none; }

            /* 侧栏常驻为收缩窄条；side-open 时滑出完整抽屉 */
            .sidebar {
                position: fixed;
                top: 60px;
                left: 0;
                bottom: 0;
                z-index: 50;
                width: 52px;
                border-right: none;
                box-shadow: 1px 0 4px rgba(0,0,0,0.08);
            }
            body.side-open .sidebar { width: 240px; box-shadow: 2px 0 8px rgba(0,0,0,0.15); }
            body.side-open .mask { display: block; }

            /* 抽屉展开时恢复完整菜单（覆盖收缩态，源码在后同权重胜出） */
            body.side-open .group-title { display: block; }
            body.side-open .menu-name { display: inline; }
            body.side-open .menu-item {
                justify-content: flex-start;
                padding: 14px 20px;
                border-left: 3px solid transparent;
            }
            body.side-open .side-head { justify-content: space-between; padding: 8px 14px 12px; }
            body.side-collapsed.side-open .side-toggle .ico-collapse { display: inline; }
            body.side-collapsed.side-open .side-toggle .ico-expand { display: none; }

            /* 内容区为常驻窄条让位 */
            .content { margin-left: 52px; }

            /* 门禁卡片小屏自适应 */
            .gate-card {
                width: calc(100vw - 40px);
                max-width: 360px;
                padding: 32px 24px;
            }
        }
    </style>
</head>
<body>
    <!-- 顶部标题栏 -->
    <div class="header">
        <div class="logo">A</div>
        <h1>Alance 测试工具平台</h1>
        <span class="sub">Test Tools Platform</span>
    </div>

    <!-- 移动端抽屉菜单遮罩 -->
    <div class="mask" onclick="closeSidebar()"></div>

    <!-- 主体区域 -->
    <div class="main">
        <!-- 左侧 Tab 菜单 -->
        <div class="sidebar">
            <div class="side-head">
                <span class="group-title">Tools List</span>
                <button class="side-toggle" onclick="toggleSidebar()" aria-label="展开或收起菜单"><span class="ico-collapse">«</span><span class="ico-expand">»</span></button>
            </div>
            {% for item in menu %}
            <div class="menu-item{% if loop.first %} active{% endif %}"
                 data-key="{{ item.key }}"
                 title="{{ item.name }}"
                 onclick="switchTool('{{ item.key }}', this)">
                <span class="idx">{{ '%02d'|format(loop.index) }}</span>
                <span class="menu-name">{{ item.name }}</span>
            </div>
            {% endfor %}
        </div>

        <!-- 右侧功能页面（iframe 隔离各工具的 JS/CSS 命名空间） -->
        <div class="content">
            <iframe id="toolFrame" src="about:blank" title="功能区"></iframe>
        </div>
    </div>

    <!-- 邀请码门禁 -->
    <div class="gate" id="gate">
        <div class="gate-card">
            <div class="gate-logo">A</div>
            <h2>Alance 测试工具平台</h2>
            <p>请输入邀请码访问</p>
            <input type="password" id="inviteCode" placeholder="邀请码" autocomplete="off"
                   onkeydown="if(event.key==='Enter') checkInvite()">
            <button class="btn" onclick="checkInvite()">进 入</button>
            <div class="gate-error" id="gateError"></div>
        </div>
    </div>

    <script>
        /** 邀请码（本会话通过后记住，关闭标签页后失效） */
        const INVITE_CODE = 'alan';
        const STORAGE_KEY = 'alance_invite_passed';

        /**
         * 校验邀请码：通过则隐藏门禁并加载默认工具
         */
        function checkInvite() {
            const input = document.getElementById('inviteCode');
            const err = document.getElementById('gateError');
            if (input.value.trim() === INVITE_CODE) {
                sessionStorage.setItem(STORAGE_KEY, '1');
                err.textContent = '';
                document.getElementById('gate').classList.add('hidden');
                document.getElementById('toolFrame').src = '/t/{{ menu[0].key }}/';
            } else {
                err.textContent = '邀请码错误，请重新输入';
                input.value = '';
                input.focus();
            }
        }

        // 页面加载时：本会话已验证过则直接进入
        if (sessionStorage.getItem(STORAGE_KEY) === '1') {
            document.getElementById('gate').classList.add('hidden');
            document.getElementById('toolFrame').src = '/t/{{ menu[0].key }}/';
        } else {
            window.addEventListener('load', () => document.getElementById('inviteCode').focus());
        }

        /**
         * 判断是否为移动端视口
         * @returns {boolean} 宽度 ≤768px 视为移动端
         */
        function isMobile() {
            return window.matchMedia('(max-width: 768px)').matches;
        }

        /**
         * 展开/收起左侧菜单：
         * 桌面端 切换 side-collapsed（完整菜单 ↔ 极简窄条）
         * 移动端 切换 side-open（常驻窄条 ↔ 完整抽屉+遮罩）
         */
        function toggleSidebar() {
            if (isMobile()) {
                document.body.classList.toggle('side-open');
            } else {
                document.body.classList.toggle('side-collapsed');
            }
        }

        /**
         * 关闭移动端抽屉菜单（点遮罩或选中菜单后调用，回到常驻窄条）
         */
        function closeSidebar() {
            document.body.classList.remove('side-open');
        }

        /**
         * 按当前视口套用默认状态：
         * 移动端常驻收缩窄条（side-collapsed），桌面端默认展开
         */
        function applyViewportState() {
            if (isMobile()) {
                document.body.classList.add('side-collapsed');
                document.body.classList.remove('side-open');
            } else {
                document.body.classList.remove('side-open');
            }
        }
        applyViewportState();
        window.addEventListener('resize', applyViewportState);

        /**
         * 切换左侧菜单：更新选中态并加载对应工具页面
         * @param {string} key - 工具挂载 key
         * @param {HTMLElement} el - 被点击的菜单项
         */
        function switchTool(key, el) {
            if (sessionStorage.getItem(STORAGE_KEY) !== '1') return;
            document.querySelectorAll('.menu-item').forEach(m => m.classList.remove('active'));
            el.classList.add('active');
            document.getElementById('toolFrame').src = '/t/' + key + '/';
            closeSidebar();
        }
    </script>
</body>
</html>
